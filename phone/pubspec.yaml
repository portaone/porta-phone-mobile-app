name: webtrit_phone
description: WebTrit Phone application.
publish_to: 'none'

# Dart pub workspace - used by Melos v7 for package discovery
workspace:
  - packages/api
  - packages/phone_number
  - packages/signaling
  - packages/ssl_certificates
  - packages/store_info_extractor
  - packages/theme_schema
  - packages/device_auto_rotate
  - packages/data/app_database
  - packages/_http_client
  - packages/_web_socket_channel
  - packages/_tcp_proxy
  - packages/pjsua_companion

# Version format: <Major>.<Minor>.<Patch>[-<Pre-release>]+<Build>
# Where:
#   - <Major>, <Minor>, <Patch>: non-negative integers, decided by the developer
#   - <Pre-release>: optional, series of dot-separated identifiers, decided by the developer
#   - <Build>: non-negative integer; a monotonic counter incremented by one on
#       each published build for a given client/platform. It is NOT derived from
#       <Major>.<Minor>.<Patch> and has no per-part range limit (only the platform
#       store maximum applies, e.g. Android versionCode).
version: 0.0.0+0

# Version format for app_version: <Major>.<Minor>.<Patch>
# Where:
#   - <Major>, <Minor>, <Patch>: non-negative integers, decided by the developer
# app_version represents tasks and fixed bugs, which is different from the build version that is specific to each client
app_version: 1.16.6+1

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  async: ^2.13.1
  audio_session: ^0.2.3
  auto_route: ^11.1.0
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  bloc_test: ^10.0.0
  characters: ^1.4.1
  clock: ^1.1.2
  collection: ^1.19.1
  connectivity_plus: ^7.1.1
  country_code_picker: ^3.4.1
  cross_file: ^0.3.5+2
  device_info_plus: ^13.1.0
  device_region: ^1.4.0
  dlibphonenumber: ^1.1.64
  drift: ^2.32.1
  emoji_picker_flutter: ^4.4.0
  equatable: ^2.0.8
  firebase_analytics: ^12.4.1
  firebase_app_installations: ^0.4.2+2
  firebase_core: ^4.9.0
  firebase_crashlytics: ^5.2.2
  firebase_messaging: ^16.2.2
  firebase_remote_config: ^6.5.1
  flutter_bloc: ^9.1.1
  flutter_contacts: ^2.5.0
  flutter_local_notifications: ^21.0.0
  flutter_parsed_text: ^2.2.1
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.0
  formz: ^0.8.0
  freezed_annotation: ^3.1.0
  google_api_availability: ^5.0.1
  google_fonts: ^8.1.0
  gravatar_utils: ^1.0.0
  html: ^0.15.6
  http: ^1.6.0
  image: ^4.0.0
  in_app_update: ^4.2.5
  intl: any
  json_annotation: ^4.12.0
  just_audio: ^0.10.5
  linkify: ^5.0.0
  # Used only to bridge libwebrtc's native log into package:logging - the plugin's
  # injectable sink takes this package's Logger and nothing else.
  logger: ^2.8.0
  logging: ^1.3.0
  logging_appenders: ^2.0.0+1
  mask_text_input_formatter: ^2.9.0
  material_color_utilities: any
  meta: any
  mobile_scanner: ^7.2.0
  package_info_plus: ^10.1.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  phoenix_socket: ^0.8.0
  provider: ^6.1.5+1
  pub_semver: ^2.2.0
  quiver: ^3.2.2
  rxdart: ^0.28.0
  # The lossless numeric-coercion guard for ICE ufrags is merged upstream but is
  # not in the latest pub.dev release (0.3.2) yet.
  sdp_transform:
    git:
      url: https://github.com/flutter-webrtc/dart-sdp-transform.git
      ref: master
  share_plus: ^13.1.0
  shared_preferences: ^2.5.5
  stream_transform: ^2.1.1
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  validators: ^3.0.0
  webview_flutter: ^4.13.1
  webview_flutter_web: ^0.2.3+4
  workmanager: ^0.9.0+3

  # Local path/workspace packages, sorted by name.
  app_database:
    path: ./packages/data/app_database
  device_auto_rotate:
    path: ./packages/device_auto_rotate
  pjsua_companion:
    path: ./packages/pjsua_companion
  ssl_certificates:
    path: ./packages/ssl_certificates
  store_info_extractor:
    path: ./packages/store_info_extractor
  api:
    path: ./packages/api
  theme_schema:
    path: ./packages/theme_schema
  webtrit_callkeep:
    # develop tracks the local working copy of callkeep for co-development.
    # On release branches this is pinned to a callkeep tag (see docs/release_versioning.md).
    # Never back-merge a git ref onto develop - keep this a path here (enforced by callkeep-path-guard).
    path: ../callkeep/webtrit_callkeep
  phone_number:
    path: ./packages/phone_number
  signaling:
    path: ./packages/signaling
  signaling_service:
    path: ./packages/signaling_service/signaling_service

  # Git forks, sorted by name.
  flutter_webrtc:
    git:
      url: https://github.com/portaone/flutter-webrtc.git
      ref: po/1.6.2+hotfix.3-3

dev_dependencies:
  # Reached directly by the hub replay tests, which drive the Android hub and the
  # shared session projection end to end into a real CallBloc.
  signaling_service_android:
    path: ./packages/signaling_service/signaling_service_android
  signaling_service_platform_interface:
    path: ./packages/signaling_service/signaling_service_platform_interface
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  auto_route_generator: ^10.5.0
  build_runner: ^2.15.0
  fake_async: ^1.3.3
  flutter_gen_runner: ^5.14.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  # TODO: temporary fork pin. Switch back to a pub.dev version constraint once
  # analyzer 8.3-14 compatibility is published upstream
  # (SERDUN/l10n_mapper#1 -> kwado-tech/l10n_mapper).
  l10n_mapper_generator:
    git:
      url: https://github.com/SERDUN/l10n_mapper.git
      ref: dd2095bfc9a49ac9190dd4821d5bbc6b0f48f055
      path: l10n_mapper_generator
  melos: ^7.8.0
  mocktail: ^1.0.5
  package_rename: ^1.8.0
  json_schema: ^5.2.2
  # patrol is provisioned only for integration-test builds (see tool/scripts/*),
  # NOT committed here: patrol.podspec weak-links XCTest and Flutter does not strip
  # dev dependencies from iOS release builds (flutter/flutter#163874), so shipping it
  # makes the app reference XCTest and Apple rejects it (guideline 2.5.1). Provision
  # for tests with: flutter pub add dev:patrol:^4.6.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - pubspec.yaml
    - assets/images/
    - assets/callkeep/
    - assets/login/
    - assets/ringtones/
    - assets/themes/
    - assets/fonts/
    - assets/certificates/

flutter_gen:
  output: lib/app/
  integrations:
    flutter_svg: true

patrol:
  app_name: Webtrit
  android:
    package_name: com.webtrit.phone
  ios:
    bundle_id: com.webtrit.phone

melos:
  useRootAsPackage: true

  command:
    bootstrap:
      usePubspecOverrides: true

  scripts:
    # ===========================
    # Formatting - melos run fmt
    # ===========================

    fmt:
      description: Format all Dart code across the workspace (excludes generated files).
      # NOTE: `formatter.exclude` in analysis_options.yaml is NOT supported by the current
      # Dart version. Shell-level filtering via find+grep is used instead to skip
      # *.g.dart, *.freezed.dart, *.gr.dart files.
      exec: >-
        find . -name "*.dart"
        -not -path "*/build/*"
        -not -path "*/.dart_tool/*"
        -not -name "*.g.dart"
        -not -name "*.freezed.dart"
        -not -name "*.gr.dart"
        | xargs dart format --line-length 120
      packageFilters:
        dirExists: lib

    fmt:check:
      description: Check formatting without making changes (exit 1 if unformatted).
      exec: >-
        find . -name "*.dart"
        -not -path "*/build/*"
        -not -path "*/.dart_tool/*"
        -not -name "*.g.dart"
        -not -name "*.freezed.dart"
        -not -name "*.gr.dart"
        | xargs dart format --line-length 120 --set-exit-if-changed
      packageFilters:
        dirExists: lib

    # ===========================
    # Code Generation - melos run generate
    # ===========================

    generate:
      description: Run build_runner for packages that use code generation.
      exec: dart run build_runner build --workspace
      packageFilters:
        dependsOn:
          - build_runner

    generate:watch:
      description: Watch and rebuild generated files on change.
      exec: dart run build_runner watch --workspace
      packageFilters:
        dependsOn:
          - build_runner

    generate:clean:
      description: Clean and rebuild generated files.
      exec: dart run build_runner clean
      packageFilters:
        dependsOn:
          - build_runner

    # ===========================
    # Licenses - melos run licenses:generate
    # ===========================

    licenses:generate:
      description: Regenerate THIRD_PARTY_LICENSES.md from the resolved dependencies.
      run: dart run tool/generate_licenses.dart

    # ===========================
    # Testing - melos run test
    # ===========================

    test:
      description: Run all tests across the workspace.
      exec: flutter test
      packageFilters:
        dirExists: test

    test:unit:
      description: Run unit tests only.
      exec: flutter test test/
      packageFilters:
        dirExists: test

    test:coverage:
      description: Run tests with coverage report.
      exec: flutter test --coverage
      packageFilters:
        dirExists: test

    # ===========================
    # Dependencies - melos run get
    # ===========================

    get:
      description: Run pub get at workspace root.
      run: flutter pub get

    upgrade:
      description: Upgrade dependencies to latest compatible versions.
      run: flutter pub upgrade

    upgrade:major:
      description: Upgrade dependencies including major versions.
      run: flutter pub upgrade --major-versions

    outdated:
      description: Show outdated dependencies for all packages.
      run: flutter pub outdated

    # ===========================
    # Analysis - melos run analyze
    # ===========================

    analyze:
      description: Run Dart analysis across the workspace.
      exec: flutter analyze
      packageFilters:
        dirExists: lib

    # ===========================
    # Combined - melos run check | melos run ci
    # ===========================

    check:
      description: Run formatting check, analysis, and l10n validation.
      steps:
        - fmt:check
        - analyze
        - l10n:check

    ci:
      description: Full CI pipeline - get, generate, check format, analyze, l10n check, test.
      steps:
        - get
        - generate
        - fmt:check
        - analyze
        - l10n:check
        - test

    # ===========================
    # Run - melos run start:android | start:ios
    # ===========================

    start:android:
      description: Run on Android with dart_define.json. Set FLUTTER_FLAGS for extra flags.
      run: flutter run --dart-define-from-file=dart_define.json ${FLUTTER_FLAGS:-}

    start:ios:
      description: Run on iOS device/simulator. Set FLUTTER_FLAGS for extra flags.
      run: flutter run -d iPhone --dart-define-from-file=dart_define.json ${FLUTTER_FLAGS:-}

    # ===========================
    # Build - melos run build:apk | build:appbundle | build:ios
    # ===========================

    build:apk:
      description: Build Android APK. Optional features are resolved from dart_define.json. Set FLUTTER_FLAGS for extra flags (e.g. --release).
      run: flutter build apk --dart-define-from-file=dart_define.json --no-tree-shake-icons ${FLUTTER_FLAGS:-}

    build:appbundle:
      description: Build Android App Bundle. Optional features are resolved from dart_define.json. Set FLUTTER_FLAGS for extra flags.
      run: flutter build appbundle --dart-define-from-file=dart_define.json --no-tree-shake-icons ${FLUTTER_FLAGS:-}

    build:ios:
      description: >-
        Build iOS app. Optional features are resolved from dart_define.json, as on Android.
        Set FLUTTER_FLAGS for extra flags (e.g. --release --no-codesign).
      run: >-
        sh tool/scripts/ios_optional_features.sh &&
        flutter build ios --dart-define-from-file=dart_define.json --no-tree-shake-icons ${FLUTTER_FLAGS:-}

    build:ios:config:
      description: >-
        Configure the Xcode project without building it. Optional features are resolved from
        dart_define.json, as on Android. Set FLUTTER_FLAGS for extra flags
        (e.g. --build-name, --build-number, --no-codesign).
      run: >-
        sh tool/scripts/ios_optional_features.sh &&
        flutter build ios --dart-define-from-file=dart_define.json --no-tree-shake-icons --config-only ${FLUTTER_FLAGS:-}

    browserstack:upload:
      description: >-
        Upload an apk to BrowserStack App Live for manual testing on real devices.
        Reads BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY from .env.
        Set BS_ARGS for extra flags (e.g. --build, --list, a file path).
      run: tool/scripts/browserstack_upload.sh ${BS_ARGS:-}

    # ===========================
    # Fastlane - melos run fastlane:ios:build | fastlane:android:upload
    # ===========================

    fastlane:install:
      description: Install fastlane if it is missing (brew on macOS, gem elsewhere).
      run: |
        set -eo pipefail
        if command -v fastlane >/dev/null 2>&1; then
          echo "fastlane already installed: $(fastlane --version | tail -n 1)"
        elif [ "$(uname -s)" = "Darwin" ]; then
          brew install fastlane
        else
          gem install fastlane
        fi

    fastlane:ios:build:
      description: >
        Build and sign the iOS ipa via ios/fastlane. Reads IOS_CERTIFICATE_PATH,
        IOS_PROVISIONING_PROFILE_PATH, IOS_CODE_SIGNING_IDENTITY, IOS_TEAM_ID, IOS_BUILD_NAME,
        IOS_BUILD_NUMBER, IOS_BUILD_FILE_NAME from the environment.
      steps:
        - fastlane:install
        - cd ios && fastlane ios build

    fastlane:ios:upload:
      description: >
        Upload the built ipa to TestFlight. Reads IOS_APP_STORE_CONNECT_API_KEY_ID,
        IOS_APP_STORE_CONNECT_API_KEY_ISSUER_ID, IOS_APP_STORE_CONNECT_API_KEY_P8_PATH,
        IOS_BUILD_FILE_NAME from the environment.
      steps:
        - fastlane:install
        - cd ios && fastlane ios upload

    fastlane:android:build:
      description: >
        Build the Android app bundle via android/fastlane. Reads ANDROID_BUILD_TARGET,
        ANDROID_BUILD_NAME, ANDROID_BUILD_NUMBER from the environment.
      steps:
        - fastlane:install
        - cd android && fastlane android build

    fastlane:android:upload:
      description: >
        Upload the built aab to Google Play. Reads ANDROID_PLAY_STORE_TRACK,
        ANDROID_PLAY_STORE_RELEASE_STATUS, ANDROID_PLAY_STORE_JSON_KEY_PATH,
        ANDROID_PLAY_STORE_PACKAGE_NAME, ANDROID_AAB_PATH from the environment.
      steps:
        - fastlane:install
        - cd android && fastlane android upload

    # ===========================
    # Clean - melos run clean | clean:git
    # ===========================

    clean:
      description: Run flutter clean in all packages.
      exec: flutter clean

    clean:git:
      description: Hard-reset repo and remove untracked files (DESTRUCTIVE).
      run: |
        git reset --hard HEAD
        git clean -df

    # ===========================
    # Assets - melos run icons:generate | splash:generate | assets:generate
    # ===========================

    icons:generate:
      description: Generate launcher icons from tool/configs/flutter_launcher_icons.yaml.
      run: dart run flutter_launcher_icons -f tool/configs/flutter_launcher_icons.yaml

    splash:generate:
      description: Generate native splash screen from tool/configs/flutter_native_splash.yaml.
      run: dart run flutter_native_splash:create --path=tool/configs/flutter_native_splash.yaml

    assets:generate:
      description: Generate launcher icons and native splash screen.
      steps:
        - icons:generate
        - splash:generate

    package:rename:
      description: >
        Apply the package name and app name from tool/configs/package_rename_config.yaml,
        which webtrit_phone_tools writes during configurator:generate.
      run: dart run package_rename --path=tool/configs/package_rename_config.yaml

    # ===========================
    # Configurator - melos run configurator:generate
    # ===========================

    configurator:generate:
      description: >
        Fetch this brand from the configurator backend, generate the app's icons, splash and
        identifiers from it, and run flutterfire configure for all platforms.
        Reads APP_ID and CONFIGURATOR_TOKEN from .env file. A production signing keystore is
        optional: present it under KEYSTORES_ROOT/<APP_ID> to also carry SSL certificates and
        re-run flutterfire configure; a local debug build works without one.
      run: |
        set -eo pipefail
        [ -f .env ] || { echo "ERROR: .env not found. Copy .env.example to .env and fill in your credentials." >&2; exit 1; }
        APP_ID=$(grep -E '^(export[[:space:]]+)?APP_ID=' .env | cut -d '=' -f2-)
        CONFIGURATOR_TOKEN=$(grep -E '^(export[[:space:]]+)?CONFIGURATOR_TOKEN=' .env | cut -d '=' -f2-)
        KEYSTORES_ROOT=../keystores/applications
        KEYSTORE_APP_PATH="$KEYSTORES_ROOT/${APP_ID:?APP_ID not found in .env}"
        # `dart run` streams a "Running build hooks..." progress fragment on stderr, and melos
        # labels everything a script writes to stderr as ERROR - which reads as a failed run even
        # though the command succeeded. Strip just that fragment; any other stderr text, the exit
        # code and stdout pass through untouched.
        phone_tools() {
          { dart run ../tools/bin/webtrit_phone_tools.dart "$@" 2>&1 1>&3 \
            | sed -e 's/Running build hooks\.\.\.//g' -e '/^[[:space:]]*$/d' >&2; } 3>&1
        }
        # Everything below is keystore-optional: --keystores-path / --keystore-path are omitted
        # entirely unless a real keystore for this app is checked out locally, so a debug build
        # never needs one.
        RESOURCES_ARGS=(--applicationId="$APP_ID" --token="${CONFIGURATOR_TOKEN:?CONFIGURATOR_TOKEN not found in .env}")
        KEYSTORE_ARGS=()
        if [ -d "$KEYSTORE_APP_PATH" ]; then
          RESOURCES_ARGS+=(--keystores-path="$KEYSTORES_ROOT")
          KEYSTORE_ARGS+=(--keystore-path="$KEYSTORE_APP_PATH")
        fi
        phone_tools \
          configurator-resources \
          "${RESOURCES_ARGS[@]}"
        phone_tools \
          configurator-generate \
          "${KEYSTORE_ARGS[@]}"
        # This project's own generators, the same three the build workflow asks
        # for. The rename goes last: the icons and the splash are written into
        # the platform folders it then rewrites.
        dart run melos run icons:generate
        dart run melos run splash:generate
        dart run melos run package:rename
        phone_tools \
          configurator-setup \
          --platform ios \
          --platform android \
          "${KEYSTORE_ARGS[@]}"

    # ===========================
    # Localization - melos run l10n:generate | l10n:check | l10n:pull | l10n:fetch
    # ===========================

    l10n:generate:
      description: Generate Flutter localization files from ARB files and format them at the project width.
      # NOTE: `flutter gen-l10n` formats its output at the Dart default of 80 columns
      # and does not read `formatter.page_width` from analysis_options.yaml. The fmt
      # scripts above skip generated files, so without this reformat every regeneration
      # carries thousands of lines of rewrapping noise. `l10n:check` guards the result.
      run: |
        flutter gen-l10n
        dart format --line-length 120 lib/l10n

    l10n:check:
      description: Validate ARB files against app_en.arb (key parity, ICU placeholders, empty values, mapper coverage).
      run: dart tool/check_l10n.dart

    l10n:pull:
      description: Pull the configurator's translation catalog into the ARB files. Reads CONFIGURATOR_TOKEN from .env.
      # The catalog owns the values, so this is how a correction made there comes
      # back here. The fetch overwrites rather than merges; it refuses an export
      # that would delete keys this checkout has, so there is nothing to vet on
      # this side.
      run: |
        set -eo pipefail
        [ -f .env ] || { echo "ERROR: .env not found. Copy .env.example to .env and fill in your credentials." >&2; exit 1; }
        CONFIGURATOR_TOKEN=$(grep -E '^(export[[:space:]]+)?CONFIGURATOR_TOKEN=' .env | cut -d '=' -f2-)
        # `dart run` streams a "Running build hooks..." progress fragment on stderr, and melos
        # labels everything a script writes to stderr as ERROR - which reads as a failed run even
        # though the command succeeded. Strip just that fragment; any other stderr text, the exit
        # code and stdout pass through untouched.
        phone_tools() {
          { dart run ../tools/bin/webtrit_phone_tools.dart "$@" 2>&1 1>&3 \
            | sed -e 's/Running build hooks\.\.\.//g' -e '/^[[:space:]]*$/d' >&2; } 3>&1
        }
        phone_tools \
          configurator-translations-fetch \
          --token="${CONFIGURATOR_TOKEN:?CONFIGURATOR_TOKEN not found in .env}"

    l10n:fetch:
      description: Pull the translation catalog and regenerate the localization classes.
      steps:
        - l10n:pull
        - l10n:generate

    # ===========================
    # IDE - melos run ide:sync
    # ===========================

    ide:sync:
      description: Sync IDE run configurations from tool/run/ to .idea/runConfigurations/.
      run: |
        mkdir -p .idea/runConfigurations
        rm -f .idea/runConfigurations/run-android-deeplinks*.xml
        cp tool/run/*.xml .idea/runConfigurations/

    # ===========================
    # Help - melos run --list
    # ===========================
